<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Section Studio</title>
  <link rel="stylesheet" href="../styleV2.css" />
  <style>
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .start-main {
      position: relative;
      isolation: isolate;
      display: grid;
      width: min(1280px, calc(100% - 64px));
      flex: 1;
      align-items: center;
      margin: 0 auto;
      padding: clamp(44px, 7vh, 82px) 0;
    }

    .start-hero {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 0.92fr) minmax(420px, 1.08fr);
      align-items: center;
      gap: clamp(28px, 4vw, 58px);
    }

    .start-hero::before {
      position: absolute;
      z-index: -1;
      top: 50%;
      right: -12%;
      width: 74%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(219, 235, 241, 0.72), rgba(232, 241, 245, 0.32) 45%, transparent 72%);
      content: "";
      transform: translateY(-50%);
      pointer-events: none;
    }

    .start-copy {
      position: relative;
      z-index: 1;
      max-width: 520px;
      animation: start-copy-in 650ms var(--ease) both;
    }

    .start-copy > .start-kicker {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 20px;
      color: var(--accent);
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .start-kicker::before {
      width: 25px;
      height: 1px;
      background: currentColor;
      content: "";
    }

    .start-copy h1 {
      max-width: 12ch;
      margin: 0;
      color: var(--ink);
      font-size: clamp(2.8rem, 4.25vw, 4.25rem);
      font-weight: 650;
      line-height: 1.02;
      letter-spacing: -0.065em;
    }

    .start-copy h1 span {
      color: var(--accent);
    }

    .start-copy p {
      max-width: 40ch;
      margin: 23px 0 0;
      color: var(--ink-muted);
      font-size: 1.04rem;
      line-height: 1.75;
    }

    .start-action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      min-height: 56px;
      margin-top: 32px;
      padding: 15px 23px 15px 25px;
      border-radius: var(--radius-lg);
      font-size: 0.98rem;
      font-weight: 700;
      letter-spacing: 0.005em;
      box-shadow: 0 8px 20px rgba(16, 83, 108, 0.18), inset 0 1px 0 rgba(255, 255, 255, 0.18);
      transition: transform var(--t-base), box-shadow var(--t-base);
    }

    .start-action:hover {
      box-shadow: 0 12px 26px rgba(16, 83, 108, 0.24), inset 0 1px 0 rgba(255, 255, 255, 0.2);
      transform: translateY(-3px);
    }

    .start-action:active {
      transform: translateY(-1px);
    }

    .start-action svg {
      width: 18px;
      height: 18px;
      transition: transform var(--t-base);
    }

    .start-action:hover svg {
      transform: translateX(3px);
    }

    .structure-art {
      position: relative;
      z-index: 0;
      display: block;
      width: 100%;
      max-height: 560px;
      overflow: visible;
      color: var(--accent);
      filter: drop-shadow(0 22px 22px rgba(27, 76, 96, 0.08));
      animation: start-art-in 900ms 100ms var(--ease) both;
      transform-origin: 55% 54%;
    }

    .structure-art .ground {
      fill: url(#ground-wash);
      stroke: #c6d7df;
      stroke-width: 1;
    }

    .structure-art .surface {
      fill: url(#surface-wash);
      stroke: #8eafbd;
      stroke-width: 1.2;
    }

    .structure-art .surface-side {
      fill: #bad0d9;
      fill-opacity: 0.24;
      stroke: #a5c0cb;
      stroke-width: 1;
    }

    .structure-art .beam-shadow {
      fill: none;
      stroke: #86a9b7;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 8;
      opacity: 0.2;
    }

    .structure-art .frame {
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 2.4;
    }

    .structure-art .frame-strong {
      stroke: url(#member-tone);
      stroke-width: 4;
    }

    .structure-art .secondary {
      stroke: #7299a9;
      stroke-width: 1.45;
      opacity: 0.86;
    }

    .structure-art .fine {
      fill: none;
      stroke: #b3c7d0;
      stroke-width: 0.9;
      opacity: 0.72;
    }

    .structure-art .technical {
      fill: none;
      stroke: #8faebb;
      stroke-width: 1;
      stroke-dasharray: 2 5;
      opacity: 0.8;
    }

    .structure-art .node {
      fill: #f8fbfc;
      stroke: #176b87;
      stroke-width: 1.8;
    }

    .structure-art .node-core {
      fill: #176b87;
      stroke: none;
    }

    .structure-art .load {
      fill: none;
      stroke: #5c8b9d;
      stroke-width: 1.35;
    }

    .structure-art .annotation {
      fill: #72909e;
      font-family: var(--font-mono);
      font-size: 9px;
      letter-spacing: 0.08em;
    }

    @keyframes start-copy-in {
      from {
        opacity: 0;
        transform: translateY(14px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes start-art-in {
      from {
        opacity: 0;
        transform: translateY(12px) scale(0.985);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @media (max-width: 880px) {
      .start-main {
        width: min(620px, calc(100% - 36px));
        padding: 50px 0 42px;
      }

      .start-hero {
        grid-template-columns: 1fr;
        gap: 12px;
      }

      .start-hero::before {
        top: auto;
        right: -18%;
        bottom: -8%;
        width: 100%;
        transform: none;
      }

      .start-copy {
        max-width: 560px;
      }

      .start-copy h1 {
        max-width: 12ch;
        font-size: clamp(2.65rem, 8vw, 3.6rem);
      }

      .structure-art {
        width: min(112%, 570px);
        max-height: 380px;
        justify-self: center;
        margin-top: -2px;
      }
    }

    @media (max-width: 420px) {
      .start-main {
        width: calc(100% - 32px);
        padding-top: 42px;
      }

      .start-copy h1 {
        font-size: 2.55rem;
      }

      .start-copy p {
        margin-top: 17px;
        font-size: 0.96rem;
      }

      .start-action {
        width: 100%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .start-copy,
      .structure-art {
        animation: none;
      }

      .start-action,
      .start-action svg {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <div class="bg-paper" aria-hidden="true"></div>

  <header class="topbar">
    <a class="brand-home" href="start.html" aria-label="Section Studio home">
      <span class="brand">
        <span class="brand-mark" aria-hidden="true">∫</span>
        <span class="brand-text">
          <span class="brand-title">Section Studio</span>
        </span>
      </span>
    </a>
  </header>

  <main class="start-main">
    <section class="start-hero" aria-labelledby="welcome-heading">
      <div class="start-copy">
        <p class="start-kicker">Structural design, made clear</p>
        <h1 id="welcome-heading">A clearer way to design <span>structures.</span></h1>
        <p>Model a beam, explore its response, and develop a section design in one focused workspace.</p>

          Start Designing

            <path d="M4 10h11m-4-4 4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </a>
      </div>

          <linearGradient id="member-tone" x1="0" y1="0" x2="1" y2="1">

            <stop offset="0.52" stop-color="#176b87" />
            <stop offset="1" stop-color="#10536c" />
          </linearGradient>
          <pattern id="floor-grid" width="28" height="20" patternUnits="userSpaceOnUse" patternTransform="skewY(19)">
            <path d="M28 0H0V20" fill="none" stroke="#9bb7c2" stroke-width="0.65" opacity="0.6" />
          </pattern>
        </defs>

          <path d="m508 301 58 19m-58-19 17 12m-17-12 20-2" />

        <g class="surface-side">

          <path d="m197 150 127 50m59-112 127 50" />
        </g>

        <g class="beam-shadow">
          <path d="m130 147 128 50 231-91-128-49Z" />
          <path d="m130 315 128 50 231-91-128-50Z" />
          <path d="M130 315V147m128 218V197m231 77V106M361 224V57" />

          <path d="M130 315V147m128 218V197m231 77V106M361 224V57" />
        </g>
        <g class="secondary">

          <path d="M130 315V147m128 218V197m231 77V106M361 224V57" />

        <g class="node">

  </main>

  <footer class="footer">
    <span class="muted small">Beam Calculator by Ben Farson, 2026. Educational use only — not for actual design.</span>

</body>
</html>
