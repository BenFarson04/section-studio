<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Section Studio</title>
  <link rel="stylesheet" href="../styleV2.css" />
  <style>
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .start-main {
      position: relative;
      isolation: isolate;
      display: grid;
      width: min(1280px, calc(100% - 64px));
      flex: 1;
      align-items: center;
      margin: 0 auto;
      padding: clamp(44px, 7vh, 82px) 0;
    }

    .start-hero {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 0.92fr) minmax(420px, 1.08fr);
      align-items: center;
      gap: clamp(28px, 4vw, 58px);
    }

    .start-hero::before {
      position: absolute;
      z-index: -1;
      top: 50%;
      right: -12%;
      width: 74%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(219, 235, 241, 0.72), rgba(232, 241, 245, 0.32) 45%, transparent 72%);
      content: "";
      transform: translateY(-50%);
      pointer-events: none;
    }

    .start-copy {
      position: relative;
      z-index: 1;
      max-width: 520px;
      animation: start-copy-in 650ms var(--ease) both;
    }

    .start-copy > .start-kicker {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 20px;
      color: var(--accent);
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .start-kicker::before {
      width: 25px;
      height: 1px;
      background: currentColor;
      content: "";
    }

    .start-copy h1 {
      max-width: 12ch;
      margin: 0;
      color: var(--ink);
      font-size: clamp(2.8rem, 4.25vw, 4.25rem);
      font-weight: 650;
      line-height: 1.02;
      letter-spacing: -0.065em;
    }

    .start-copy h1 span {
      color: var(--accent);
    }

    .start-copy p {
      max-width: 40ch;
      margin: 23px 0 0;
      color: var(--ink-muted);
      font-size: 1.04rem;
      line-height: 1.75;
    }

    .start-action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      min-height: 56px;
      margin-top: 32px;
      padding: 15px 23px 15px 25px;
      border-radius: var(--radius-lg);
      font-size: 0.98rem;
      font-weight: 700;
      letter-spacing: 0.005em;
      box-shadow: 0 8px 20px rgba(16, 83, 108, 0.18), inset 0 1px 0 rgba(255, 255, 255, 0.18);
      transition: transform var(--t-base), box-shadow var(--t-base);
    }

    .start-action:hover {
      box-shadow: 0 12px 26px rgba(16, 83, 108, 0.24), inset 0 1px 0 rgba(255, 255, 255, 0.2);
      transform: translateY(-3px);
    }

    .start-action:active {
      transform: translateY(-1px);
    }

    .start-action svg {
      width: 18px;
      height: 18px;
      transition: transform var(--t-base);
    }

    .start-action:hover svg {
      transform: translateX(3px);
    }

    .structure-art {
      position: relative;
      z-index: 0;
      display: block;
      width: 100%;
      max-height: 560px;
      overflow: visible;
      color: var(--accent);
      filter: drop-shadow(0 22px 22px rgba(27, 76, 96, 0.08));
      animation: start-art-in 900ms 100ms var(--ease) both;
      transform-origin: 55% 54%;
    }

    .structure-art .art-fine {
      fill: none;
      stroke: #9cbac8;
      stroke-width: 0.9;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0.72;
    }

    .structure-art .art-dashed {
      fill: none;
      stroke: #6f9fb2;
      stroke-width: 1;
      stroke-dasharray: 3 5;
      stroke-linecap: round;
      opacity: 0.74;
    }

    .structure-art .art-ground {
      fill: url(#art-ground);
      stroke: #afc8d2;
      stroke-width: 1;
    }

    .structure-art .art-slab {
      fill: url(#art-slab-top);
      fill-opacity: 0.68;
      stroke: #8fb1bf;
      stroke-width: 1;
    }

    .structure-art .art-slab-edge {
      fill: #b8d0da;
      fill-opacity: 0.52;
      stroke: #88aab8;
      stroke-width: 0.85;
    }

    .structure-art .art-core {
      fill: url(#art-core);
      stroke: #4b8da5;
      stroke-width: 1.1;
    }

    .structure-art .steel-underlay {
      fill: none;
      stroke: #c8dfe8;
      stroke-width: 5.2;
      stroke-linecap: square;
      stroke-linejoin: round;
      opacity: 0.84;
    }

    .structure-art .structural-steel {
      fill: none;
      stroke: url(#art-steel);
      stroke-width: 2.7;
      stroke-linecap: square;
      stroke-linejoin: round;
    }

    .structure-art .tower-outline {
      fill: none;
      stroke: #104a66;
      stroke-width: 1.45;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0.88;
    }

    .structure-art .secondary-frame {
      fill: none;
      stroke: #4b8da5;
      stroke-width: 1.45;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0.82;
    }

    .structure-art .joint {
      fill: #f8fcfd;
      stroke: #176b87;
      stroke-width: 1.35;
    }

    .structure-art .joint-core {
      fill: #176b87;
      stroke: none;
    }

    .structure-art .callout-card {
      fill: url(#art-card);
      stroke: #a8c5d1;
      stroke-width: 0.9;
    }

    .structure-art .callout-rule {
      fill: none;
      stroke: #c4d7df;
      stroke-width: 0.8;
    }

    .structure-art .engineering-label-strong {
      fill: #315a6c;
      font-family: var(--font-mono);
      font-size: 7px;
      font-weight: 700;
      letter-spacing: 0.055em;
    }

    .structure-art .engineering-label {
      fill: #668391;
      font-family: var(--font-mono);
      font-size: 6.4px;
      letter-spacing: 0.035em;
    }

    .structure-art .engineering-micro {
      fill: #829da9;
      font-family: var(--font-mono);
      font-size: 5.6px;
      letter-spacing: 0.025em;
    }

    @media (max-width: 520px) {
      .structure-art .engineering-label-strong {
        font-size: 8.4px;
      }

      .structure-art .engineering-label {
        font-size: 7.4px;
      }

      .structure-art .engineering-micro {
        font-size: 6.6px;
      }
    }

    .structure-art .diagram-fill {
      fill: #82b2c2;
      fill-opacity: 0.3;
      stroke: none;
    }

    .structure-art .diagram-line {
      fill: none;
      stroke: #176b87;
      stroke-width: 1.3;
      stroke-linecap: round;
    }

    .structure-art .analysis-line {
      fill: none;
      stroke: #6f9fb2;
      stroke-width: 0.9;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    @keyframes start-copy-in {
      from {
        opacity: 0;
        transform: translateY(14px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes start-art-in {
      from {
        opacity: 0;
        transform: translateY(12px) scale(0.985);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @media (max-width: 880px) {
      .start-main {
        width: min(620px, calc(100% - 36px));
        padding: 50px 0 42px;
      }

      .start-hero {
        grid-template-columns: 1fr;
        gap: 12px;
      }

      .start-hero::before {
        top: auto;
        right: -18%;
        bottom: -8%;
        width: 100%;
        transform: none;
      }

      .start-copy {
        max-width: 560px;
      }

      .start-copy h1 {
        max-width: 12ch;
        font-size: clamp(2.65rem, 8vw, 3.6rem);
      }

      .structure-art {
        width: min(112%, 570px);
        max-height: 380px;
        justify-self: center;
        margin-top: -2px;
      }
    }

    @media (max-width: 420px) {
      .start-main {
        width: calc(100% - 32px);
        padding-top: 42px;
      }

      .start-copy h1 {
        font-size: 2.55rem;
      }

      .start-copy p {
        margin-top: 17px;
        font-size: 0.96rem;
      }

      .start-action {
        width: 100%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .start-copy,
      .structure-art {
        animation: none;
      }

      .start-action,
      .start-action svg {
        transition: none;
      }
    }
  </style>
</head>
