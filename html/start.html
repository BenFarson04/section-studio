<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Section Studio</title>
  <link rel="stylesheet" href="../styleV2.css" />
  <style>
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .start-main {
      display: grid;
      width: min(1120px, calc(100% - 40px));
      flex: 1;
      align-items: center;
      margin: 0 auto;
      padding: clamp(40px, 8vh, 88px) 0;
    }

    .start-hero {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(320px, 0.92fr);
      align-items: center;
      gap: clamp(32px, 6vw, 76px);
    }

    .start-copy {
      max-width: 510px;
    }

    .start-copy h1 {
      max-width: 11ch;
      margin: 0;
      color: var(--ink);
      font-size: clamp(2.35rem, 3.5vw, 3.35rem);
      line-height: 1.08;
      letter-spacing: -0.055em;
    }

    .start-copy p {
      max-width: 43ch;
      margin: 20px 0 0;
      color: var(--ink-muted);
      font-size: 1rem;
      line-height: 1.7;
    }

    .start-action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      min-height: 56px;
      margin-top: 30px;
      padding: 15px 25px;
      border-radius: var(--radius-md);
      font-size: 0.98rem;
      font-weight: 700;
      letter-spacing: 0.005em;
      box-shadow: 0 4px 12px rgba(16, 83, 108, 0.17);
      transition: transform var(--t-fast), box-shadow var(--t-fast);
    }

    .start-action:hover {
      box-shadow: 0 7px 18px rgba(16, 83, 108, 0.22);
      transform: translateY(-2px);
    }

    .start-action svg {
      width: 18px;
      height: 18px;
    }

    .structure-art {
      width: 100%;
      max-height: 430px;
      overflow: visible;
      color: var(--accent);
    }

    .structure-art .frame {
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 2;
    }

    .structure-art .secondary {
      stroke: #85aab8;
      stroke-width: 1.5;
    }

    .structure-art .fine {
      stroke: #bdcdd4;
      stroke-width: 1;
    }

    .structure-art .node {
      fill: #fff;
      stroke: currentColor;
      stroke-width: 2;
    }

    .structure-art .load {
      fill: none;
      stroke: #6f98a8;
      stroke-width: 1.5;
    }

    @media (max-width: 760px) {
      .start-main {
        width: min(560px, calc(100% - 36px));
        padding: 54px 0 42px;
      }

      .start-hero {
        grid-template-columns: 1fr;
        gap: 28px;
      }

      .start-copy h1 {
        max-width: 13ch;
        font-size: clamp(2.25rem, 8vw, 3rem);
      }

      .structure-art {
        width: min(100%, 430px);
        max-height: 300px;
        justify-self: center;
      }
    }

    @media (max-width: 420px) {
      .start-main {
        width: calc(100% - 32px);
      }

      .start-copy h1 {
        font-size: 2.2rem;
      }

      .start-action {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="bg-paper" aria-hidden="true"></div>

  <header class="topbar">
    <a class="brand-home" href="start.html" aria-label="Section Studio home">
      <span class="brand">
        <span class="brand-mark" aria-hidden="true">∫</span>
        <span class="brand-text">
          <span class="brand-title">Section Studio</span>
        </span>
      </span>
    </a>
  </header>

  <main class="start-main">
    <section class="start-hero" aria-labelledby="welcome-heading">
      <div class="start-copy">
        <h1 id="welcome-heading">A clearer way to design structures.</h1>
        <p>Model a beam, explore its response, and develop a section design in one focused workspace.</p>
        <a href="index.html" class="btn btn--primary start-action">
          Start Designing
          <svg viewBox="0 0 20 20" aria-hidden="true">
            <path d="M4 10h11m-4-4 4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </a>
      </div>

      <svg class="structure-art" viewBox="0 0 520 420" role="img" aria-labelledby="structure-title">
        <title id="structure-title">Structural frame wireframe</title>
        <g class="fine">
          <path d="M58 346h390M83 366h390M106 386h390" />
          <path d="M88 330v56m70-56v56m70-56v56m70-56v56m70-56v56m70-56v56" />
        </g>
        <g class="secondary">
          <path d="M104 299 225 346 420 270 300 225Z" />
          <path d="M104 170 225 215 420 139 300 94Z" />
          <path d="M104 299V170m121 176V215m195 55V139M300 225V94" />
          <path d="M104 170 225 215 300 94m-75 121 195-76M104 299l196-74m0-131 120 45" />
        </g>
        <g class="frame">
          <path d="M104 299 225 346 420 270 300 225Z" />
          <path d="M104 170 225 215 420 139 300 94Z" />
          <path d="M104 299V170m121 176V215m195 55V139M300 225V94" />
          <path d="M104 170 225 346m0-131L104 299m196-74L420 139m0 131L300 94" />
        </g>
        <g class="node">
          <circle cx="104" cy="170" r="4" />
          <circle cx="225" cy="215" r="4" />
          <circle cx="300" cy="94" r="4" />
          <circle cx="420" cy="139" r="4" />
          <circle cx="104" cy="299" r="4" />
          <circle cx="225" cy="346" r="4" />
          <circle cx="300" cy="225" r="4" />
          <circle cx="420" cy="270" r="4" />
        </g>
        <g class="load">
          <path d="M148 91v38m-5-7 5 7 5-7M247 105v38m-5-7 5 7 5-7M346 67v38m-5-7 5 7 5-7" />
          <path d="M132 148h32m-32 0 5-4m-5 4 5 4M231 193h32m-32 0 5-4m-5 4 5 4M330 72h32m-32 0 5-4m-5 4 5 4" />
        </g>
      </svg>
    </section>
  </main>

  <footer class="footer">
    <span class="muted small">Beam Calculator by Ben Farson, 2026. Educational use only — not for actual design.</span>
  </footer>
</body>
</html>
